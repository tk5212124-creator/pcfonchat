<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f4ef">
<title>pcfonchat</title>
<style>
  :root { --bg:#f5f4ef; --card:#fff; --text:#2b2a27; --sub:#8a877f; --line:#e2dfd6; --accent:#c96442; }
  @media (prefers-color-scheme: dark) { :root { --bg:#262624; --card:#30302e; --text:#ecebe6; --sub:#9b998f; --line:#43423e; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:16px;
    background:var(--bg); color:var(--text); font:15px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", "Yu Gothic UI", sans-serif; }
  form { width:100%; max-width:320px; display:flex; flex-direction:column; gap:12px; }
  h1 { font-size:20px; margin:0 0 8px; text-align:center; }
  input, button { font:inherit; font-size:16px; padding:12px 14px; border-radius:12px; border:1px solid var(--line); }
  input { background:var(--card); color:var(--text); outline:0; }
  input:focus { border-color:var(--accent); }
  button { background:var(--accent); color:#fff; border:0; cursor:pointer; }
  button:disabled { opacity:.5; }
  #err { color:#d0453a; font-size:13px; min-height:1.2em; text-align:center; margin:0; }
</style>
</head>
<body>
<form id="f">
  <h1>pcfonchat</h1>
  <input type="password" id="pw" placeholder="パスワード" autocomplete="current-password" autofocus required>
  <button id="b">ログイン</button>
  <p id="err"></p>
</form>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const b = document.getElementById('b'), err = document.getElementById('err');
  b.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('pw').value }) });
    if (r.ok) return location.replace('/');
    err.textContent = (await r.json()).error || 'ログインできませんでした';
  } catch { err.textContent = '通信エラー'; }
  b.disabled = false;
});
</script>
</body>
</html>
