<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f4ef">
<title>pcfonchat</title>
<style>
  :root { --bg:#f5f4ef; --card:#fff; --me:#ece9df; --text:#2b2a27; --sub:#8a877f; --line:#e2dfd6; --accent:#c96442; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#262624; --card:#30302e; --me:#3b3a36; --text:#ecebe6; --sub:#9b998f; --line:#43423e; }
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:15px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", "Yu Gothic UI", sans-serif; }
  body { display:flex; flex-direction:column; height:100dvh; }
  header { padding:10px 16px; font-weight:600; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; }
  header small { color:var(--sub); font-weight:400; }
  #logout { margin-left:auto; border:0; background:none; color:var(--sub); font:inherit; font-size:13px; cursor:pointer; }
  #list { flex:1; overflow-y:auto; padding:16px; }
  .wrap { max-width:760px; margin:0 auto; }
  .msg { margin:0 0 18px; display:flex; flex-direction:column; align-items:flex-start; }
  .msg.me { align-items:flex-end; }
  .bubble { max-width:88%; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 14px;
    white-space:pre-wrap; word-break:break-word; user-select:text; -webkit-user-select:text; }
  .me .bubble { background:var(--me); }
  .bubble img, .bubble video { display:block; max-width:100%; max-height:360px; border-radius:8px; }
  .bubble a { color:var(--accent); }
  .meta { font-size:12px; color:var(--sub); margin-top:3px; display:flex; gap:10px; align-items:center; }
  .meta button { border:0; background:none; color:var(--sub); font:inherit; padding:2px 4px; cursor:pointer; }
  .meta button:hover { color:var(--text); }
  .empty { text-align:center; color:var(--sub); margin-top:30vh; }
  form { padding:10px 12px calc(10px + env(safe-area-inset-bottom)); }
  .box { max-width:760px; margin:0 auto; background:var(--card); border:1px solid var(--line); border-radius:18px;
    display:flex; align-items:flex-end; gap:6px; padding:6px; }
  textarea { flex:1; border:0; outline:0; resize:none; background:transparent; color:var(--text); font:inherit;
    font-size:16px; padding:8px; max-height:40vh; }
  .btn { border:0; border-radius:12px; width:38px; height:38px; font-size:18px; cursor:pointer; flex:none;
    background:transparent; color:var(--sub); }
  #send { background:var(--accent); color:#fff; }
  #send:disabled { opacity:.4; }
  #drop { position:fixed; inset:0; background:rgba(201,100,66,.15); border:3px dashed var(--accent); display:none;
    align-items:center; justify-content:center; font-size:20px; pointer-events:none; }
  #toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:var(--text); color:var(--bg);
    padding:6px 14px; border-radius:20px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; }
</style>
</head>
<body>
<header>pcfonchat <small id="who"></small><button type="button" id="logout" hidden>ログアウト</button></header>
<div id="list"><div class="wrap" id="msgs"></div></div>
<form id="f">
  <div class="box">
    <button type="button" class="btn" id="attach" title="ファイルを添付">📎</button>
    <input type="file" id="file" multiple hidden>
    <textarea id="t" rows="1" placeholder="メッセージ / 画像を貼り付け"></textarea>
    <button class="btn" id="send" title="送信" disabled>↑</button>
  </div>
</form>
<div id="drop">ここにドロップして送信</div>
<div id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
const ua = navigator.userAgent;
const me = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Android/.test(ua) ? 'Android' : 'PC';
const isTouch = matchMedia('(pointer: coarse)').matches;
$('who').textContent = 'この端末: ' + me;

let lastId = 0;
const shown = new Map(); // id -> element

function toast(s) { const t = $('toast'); t.textContent = s; t.style.opacity = 1; clearTimeout(t._h); t._h = setTimeout(() => t.style.opacity = 0, 1200); }
const fmtSize = (n) => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB';
const fmtTime = (t) => { const d = new Date(t), n = new Date();
  const hm = d.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
  return d.toDateString() === n.toDateString() ? hm : (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hm; };

// iPhone の http でも動くようにフォールバック付きコピー
async function copyText(s) {
  try { await navigator.clipboard.writeText(s); return true; } catch {}
  const ta = document.createElement('textarea');
  ta.value = s; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
  document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, s.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch {}
  ta.remove(); return ok;
}
async function copyImage(url) {
  try {
    const blob = await (await fetch(url)).blob();
    const png = blob.type === 'image/png' ? blob : await new Promise((r) => {
      const img = new Image(); img.onload = () => { const c = document.createElement('canvas');
        c.width = img.naturalWidth; c.height = img.naturalHeight; c.getContext('2d').drawImage(img, 0, 0); c.toBlob(r, 'image/png'); };
      img.src = url; });
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': png })]); return true;
  } catch { return false; }
}

function render(m) {
  const el = document.createElement('div');
  el.className = 'msg' + (m.from === me ? ' me' : '');
  const b = document.createElement('div'); b.className = 'bubble';
  const meta = document.createElement('div'); meta.className = 'meta';
  const info = document.createElement('span'); info.textContent = (m.from || '?') + ' · ' + fmtTime(m.time); meta.appendChild(info);
  const btn = (label, fn) => { const x = document.createElement('button'); x.type = 'button'; x.textContent = label; x.onclick = fn; meta.appendChild(x); return x; };

  if (m.file) {
    const url = '/files/' + m.file.stored;
    const t = m.file.type || '';
    if (t.startsWith('image/') && !/heic|heif/.test(t)) {
      const a = document.createElement('a'); a.href = url; a.target = '_blank';
      const img = document.createElement('img'); img.src = url; img.alt = m.file.name; img.loading = 'lazy';
      img.onload = () => { if (atBottom) scrollDown(); };
      a.appendChild(img); b.appendChild(a);
      btn('コピー', async () => toast(await copyImage(url) ? 'コピーしました' : '画像を長押し / 右クリックで保存してください'));
    } else if (t.startsWith('video/')) {
      const v = document.createElement('video'); v.src = url; v.controls = true; v.playsInline = true; v.preload = 'metadata'; b.appendChild(v);
    } else {
      b.innerHTML = `📄 <a href="${url}?dl" download></a> <small style="color:var(--sub)">${fmtSize(m.file.size)}</small>`;
      b.querySelector('a').textContent = m.file.name;
    }
    btn('保存', () => { const a = document.createElement('a'); a.href = url + '?dl'; a.download = m.file.name; a.click(); });
  } else {
    b.textContent = m.text;
    b.innerHTML = b.innerHTML.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    btn('コピー', async () => toast(await copyText(m.text) ? 'コピーしました' : 'コピーできませんでした'));
  }
  btn('削除', async () => {
    if (!confirm('削除しますか？')) return;
    await fetch('/api/messages/' + m.id, { method: 'DELETE' }); el.remove(); shown.delete(m.id); emptyCheck();
  });
  el.append(b, meta);
  return el;
}

const list = $('list');
let atBottom = true;
list.addEventListener('scroll', () => { atBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 80; });
const scrollDown = () => { list.scrollTop = list.scrollHeight; };
function emptyCheck() {
  const e = $('msgs').querySelector('.empty');
  if (!shown.size && !e) $('msgs').innerHTML = '<div class="empty">まだ何もありません。<br>PC と iPhone で同じページを開いて送ってみてください。</div>';
  if (shown.size && e) e.remove();
}

function add(msgs) {
  const stick = atBottom;
  for (const m of msgs) {
    if (shown.has(m.id)) continue;
    const el = render(m); shown.set(m.id, el); $('msgs').appendChild(el);
    lastId = Math.max(lastId, m.id);
  }
  emptyCheck();
  if (stick) scrollDown();
}

async function poll() {
  try {
    const r = await fetch('/api/messages?since=' + lastId);
    if (r.status === 401) return location.replace('/login');
    const d = await r.json();
    $('logout').hidden = !d.auth;
    add(d.messages);
    const alive = new Set(d.ids); // 他端末での削除を反映
    for (const [id, el] of shown) if (!alive.has(id)) { el.remove(); shown.delete(id); }
    emptyCheck();
  } catch {}
}
poll();
setInterval(() => { if (!document.hidden) poll(); }, 2000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });

// 送信
const t = $('t');
const resize = () => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; $('send').disabled = !t.value.trim(); };
t.addEventListener('input', resize);
t.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !isTouch) { e.preventDefault(); $('f').requestSubmit(); }
});
$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = t.value; if (!text.trim()) return;
  t.value = ''; resize();
  try {
    const r = await fetch('/api/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, from: me }) });
    if (!r.ok) throw 0;
    atBottom = true; add([await r.json()]);
  } catch { t.value = text; resize(); toast('送信に失敗しました'); }
});

async function upload(files) {
  for (const f of files) {
    toast('送信中… ' + f.name);
    try {
      const r = await fetch(`/api/upload?name=${encodeURIComponent(f.name || 'paste.png')}&from=${me}`,
        { method: 'POST', headers: { 'Content-Type': f.type || 'application/octet-stream' }, body: f });
      if (!r.ok) throw 0;
      atBottom = true; add([await r.json()]); toast('送信しました');
    } catch { toast('送信に失敗しました: ' + f.name); }
  }
}
$('logout').onclick = async () => { await fetch('/logout', { method: 'POST' }); location.replace('/login'); };
$('attach').onclick = () => $('file').click();
$('file').onchange = (e) => { upload([...e.target.files]); e.target.value = ''; };
t.addEventListener('paste', (e) => {
  const files = [...(e.clipboardData?.files || [])];
  if (files.length) { e.preventDefault(); upload(files); }
});
let dragN = 0;
addEventListener('dragenter', (e) => { if (e.dataTransfer.types.includes('Files')) { dragN++; $('drop').style.display = 'flex'; } });
addEventListener('dragleave', () => { if (--dragN <= 0) { dragN = 0; $('drop').style.display = 'none'; } });
addEventListener('dragover', (e) => e.preventDefault());
addEventListener('drop', (e) => { e.preventDefault(); dragN = 0; $('drop').style.display = 'none'; upload([...e.dataTransfer.files]); });
</script>
</body>
</html>
